<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Random Joke Generator</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; background:#f7fbff; }
    .card { background:white; padding:24px; border-radius:12px; box-shadow:0 6px 18px rgba(30,30,30,0.08); max-width:720px; width:90%; text-align:center; }
    button { padding:10px 16px; border-radius:8px; border:none; background:#2b6cb0; color:white; cursor:pointer; font-weight:600; }
    #joke { margin:20px 0; font-size:1.15rem; min-height:2.4rem; color:#111827; }
    .muted { color:#6b7280; font-size:0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Random Joke Generator</h1>
    <div id="joke" class="muted">Click Get Joke to start.</div>
    <div>
      <button id="getJoke">Get Joke</button>
      <button id="copyBtn" style="margin-left:8px;">Copy</button>
    </div>
    <p id="source" class="muted" style="margin-top:12px;"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
